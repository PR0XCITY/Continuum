# IncidentRAG evaluation questions.
#
# 30 answerable questions (20 about playbooks, 10 about incident history)
# and 10 unanswerable or off-topic questions that IncidentRAG must
# abstain on.
#
# expected_doc_ids name the documents a correct answer should cite:
#   - playbooks: the file name without .md under data/corpus/playbooks/
#   - incidents: incident_id values produced by tools/gen_incidents.py with
#     the seed below (the first eight records are its NOTABLE_INCIDENTS)
# A question that needs no sources (answerable: false) has an empty list.

version: 1
incident_generator:
  tool: tools/gen_incidents.py
  seed: 1337
  count: 200

questions:
  # --- playbooks -----------------------------------------------------------
  - id: pb-01
    question: A device was just blocked by Continuum. What should I do first?
    answerable: true
    expected_doc_ids: [pb-blocked-hid-device-response]

  - id: pb-02
    question: Why should I unplug a blocked device if Continuum has already disabled it?
    answerable: true
    expected_doc_ids: [pb-blocked-hid-device-response]

  - id: pb-03
    question: How can I tell whether a USB device that claims to be a keyboard is actually a Rubber Ducky or other BadUSB tool?
    answerable: true
    expected_doc_ids: [pb-badusb-triage-checklist]

  - id: pb-04
    question: Why shouldn't I trust a device's vendor and product id when deciding if it is safe?
    answerable: true
    expected_doc_ids: [pb-badusb-triage-checklist, pb-usb-allowlisting-policy]

  - id: pb-05
    question: Which Windows event logs show what commands ran after a keystroke injection?
    answerable: true
    expected_doc_ids: [pb-post-injection-command-review]

  - id: pb-06
    question: Where is a user's PowerShell command history file stored?
    answerable: true
    expected_doc_ids: [pb-post-injection-command-review]

  - id: pb-07
    question: Event 4688 is missing from the Security log. Does that mean no commands were executed?
    answerable: true
    expected_doc_ids: [pb-post-injection-command-review]

  - id: pb-08
    question: Should devices be allowlisted by vendor id or by device instance id?
    answerable: true
    expected_doc_ids: [pb-usb-allowlisting-policy]

  - id: pb-09
    question: How should we roll out a device allowlist to a new department?
    answerable: true
    expected_doc_ids: [pb-usb-allowlisting-policy]

  - id: pb-10
    question: How do I preserve evidence after finding a rogue USB device on a workstation?
    answerable: true
    expected_doc_ids: [pb-physical-access-evidence-preservation]

  - id: pb-11
    question: Why should building access logs and camera footage be requested quickly after a physical access incident?
    answerable: true
    expected_doc_ids: [pb-physical-access-evidence-preservation]

  - id: pb-12
    question: A user says Continuum blocked their gaming keyboard. How do I decide whether it was a false positive?
    answerable: true
    expected_doc_ids: [pb-false-positive-vs-attack]

  - id: pb-13
    question: Can a fast human typist produce burst injection cadence?
    answerable: true
    expected_doc_ids: [pb-false-positive-vs-attack]

  - id: pb-14
    question: Which Group Policy settings restrict installation of unknown USB keyboards?
    answerable: true
    expected_doc_ids: [pb-windows-hid-hardening]

  - id: pb-15
    question: What can go wrong when enabling the policy that prevents installation of devices not described by other policy settings?
    answerable: true
    expected_doc_ids: [pb-windows-hid-hardening]

  - id: pb-16
    question: What sections should a post-incident review contain?
    answerable: true
    expected_doc_ids: [pb-post-incident-review-template]

  - id: pb-17
    question: Which MITRE ATT&CK technique should a HID injection incident be tagged with?
    answerable: true
    expected_doc_ids: [pb-mitre-attack-mapping]

  - id: pb-18
    question: Should a keystroke injection incident be tagged as T1056.001 Keylogging?
    answerable: true
    expected_doc_ids: [pb-mitre-attack-mapping]

  - id: pb-19
    question: How do I re-enable every device Continuum has disabled in an emergency?
    answerable: true
    expected_doc_ids: [pb-releasing-blocked-devices]

  - id: pb-20
    question: How long does a disabled device stay disabled before Continuum releases it automatically?
    answerable: true
    expected_doc_ids: [pb-releasing-blocked-devices]

